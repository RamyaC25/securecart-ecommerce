
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCart | Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SecureCart 🛍️</h1>
        <nav>
            <button data-section="store">Store</button>
<button data-section="login">Login</button>
<button data-section="register">Register</button>
<button data-section="cart">My Cart</button>
        </nav>
    </header>

    <main>
        <section id="store">
            <h2>Explore Our Products</h2>
            <div id="products" class="products"></div>
        </section>

        <section id="login" class="hidden">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>

        <section id="register" class="hidden">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="registerName" placeholder="Full Name" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password (8+ characters)" required>
                <button type="submit">Register</button>
            </form>
        </section>

        <section id="cart" class="hidden">
            <h2>My Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3 id="cartTotal">Total: ₹0</h3>
            <button id="checkoutButton">Proceed to Checkout</button>
        </section>

        <p id="message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
